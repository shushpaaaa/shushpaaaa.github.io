<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#08090c" stroke="#ecf0f8" stroke-opacity="0.14" stroke-width="2"/>
  <g transform="translate(32, 32)">
    <!-- Subtle outer hexagon frame -->
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" fill="none" stroke="#8bb8ff" stroke-opacity="0.38" stroke-width="1.5"/>
    <!-- Faceted obsidian core -->
    <polygon points="0,-13 11.2,-6.5 0,0" fill="#1b2234" stroke="#8bb8ff" stroke-opacity="0.85" stroke-width="1.2"/>
    <polygon points="0,-13 -11.2,-6.5 0,0" fill="#10141f" stroke="#8bb8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <polygon points="11.2,-6.5 11.2,6.5 0,0" fill="#4f8ff7" fill-opacity="0.85" stroke="#8bb8ff" stroke-width="1.2"/>
    <polygon points="-11.2,-6.5 -11.2,6.5 0,0" fill="#0d1018" stroke="#8bb8ff" stroke-opacity="0.45" stroke-width="1.2"/>
    <polygon points="11.2,6.5 0,13 0,0" fill="#161d2e" stroke="#8bb8ff" stroke-opacity="0.65" stroke-width="1.2"/>
    <polygon points="-11.2,6.5 0,13 0,0" fill="#0b0d14" stroke="#8bb8ff" stroke-opacity="0.35" stroke-width="1.2"/>
    <!-- Key vertices -->
    <circle cx="0" cy="-20" r="2" fill="#f0f2f7"/>
    <circle cx="17.3" cy="10" r="2" fill="#4f8ff7"/>
    <circle cx="-17.3" cy="10" r="1.8" fill="#8bb8ff"/>
  </g>
</svg>
