<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatrixLab — Exact Rational Linear Algebra Workbench | olzhas.app</title>
  <meta name="description" content="Exact BigInt rational linear algebra workbench by Olzhas Huseynzade: 5-method inverse finder, PA=LU & LDL^T elimination, determinants, subspaces, vector geometry, Exam Mode, and personal saved matrices." />
  <meta name="theme-color" content="#141415" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://olzhas.app/matrix/">
  <meta property="og:title" content="MatrixLab — Exact Rational Linear Algebra Workbench">
  <meta property="og:description" content="Zero floating-point drift BigInt p/q workbench with 7 linear algebra instruments, full-screen Exam Mode, and local personal memory.">
  <meta property="og:image" content="https://olzhas.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://olzhas.app/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = location.search.indexOf("theme=dark") !== -1 ? "dark" : localStorage.getItem("matrixlab-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <button type="button" class="brand" id="brand-home" aria-label="Return to MatrixLab home">
        <div class="brand-mark">[A]</div>
        <div class="brand-text">
          <div class="brand-name">MatrixLab</div>
          <div class="brand-sub">Exact p/q · §1.1–4.2</div>
        </div>
      </button>

      <div class="nav-section-label">Instruments</div>
      <nav class="nav-list" id="nav-list">
        <button class="nav-item active" data-mode="inverse">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 12h6M12 9v6"/></svg>
          <span>Inverse finder</span>
          <span class="nav-section-meta">§2.5</span>
        </button>
        <button class="nav-item" data-mode="elimination">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M8 12h12M12 18h8"/></svg>
          <span>Elimination &amp; LU</span>
          <span class="nav-section-meta">§2.6</span>
        </button>
        <button class="nav-item" data-mode="determinant">
          <svg viewBox="0 0 24 24"><path d="M5 4v16M19 4v16M9 9l6 6M15 9l-6 6"/></svg>
          <span>Determinants</span>
          <span class="nav-section-meta">§3.3</span>
        </button>
        <button class="nav-item" data-mode="subspaces">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
          <span>Column &amp; nullspace</span>
          <span class="nav-section-meta">§4.2</span>
        </button>
        <button class="nav-item" data-mode="operations">
          <svg viewBox="0 0 24 24"><path d="M5 5h6v6H5zM13 13h6v6h-6zM15 5l4 4M19 5l-4 4"/></svg>
          <span>Matrix algebra</span>
          <span class="nav-section-meta">§2.4</span>
        </button>
        <button class="nav-item" data-mode="vectors">
          <svg viewBox="0 0 24 24"><path d="M4 20L19 5M19 5h-6M19 5v6M4 20h15M4 20V5"/></svg>
          <span>Vectors &amp; geometry</span>
          <span class="nav-section-meta">§1.2</span>
        </button>
        <button class="nav-item" data-mode="drills">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Practice drills</span>
          <span class="nav-section-meta">Exam</span>
        </button>
      </nav>

      <div class="nav-section-label">Personal memory</div>
      <div class="saved-section">
        <div class="saved-compose">
          <input type="text" class="saved-name-input" id="save-matrix-name" placeholder="Name matrix (optional)" maxlength="32" aria-label="Name for saved matrix">
          <button type="button" class="btn saved-add-btn" id="save-matrix-btn" title="Save active matrix to personal browser memory">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Save</span>
          </button>
        </div>
        <div class="saved-list" id="saved-list"></div>
        <div class="saved-tools">
          <button type="button" class="saved-tool-btn" id="memory-export-btn" title="Download saved matrices &amp; exam history as JSON">Export</button>
          <button type="button" class="saved-tool-btn" id="memory-import-btn" title="Import JSON backup">Import</button>
          <button type="button" class="saved-tool-btn" id="memory-reset-btn" title="Reset current workspace matrices to defaults">Reset</button>
          <input type="file" id="memory-import-file" accept="application/json,.json" hidden>
        </div>
        <div class="saved-hint" id="memory-status">Auto-saved locally in this browser</div>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="btn sidebar-exam-btn" id="sidebar-exam-btn">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Take an Exam</span>
        </button>
        <div class="kbd-hint">
          <span>Navigate cells</span>
          <span><span class="keycap">Tab</span> <span class="keycap">←↑↓→</span></span>
        </div>
        <div class="kbd-hint">
          <span>Step elimination</span>
          <span><span class="keycap">[</span> <span class="keycap">]</span></span>
        </div>
        <a href="/" class="sidebar-back-link">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>olzhas.app</span>
        </a>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title" id="page-title">Inverse finder</h1>
          <span class="page-subtitle" id="page-subtitle">Compare Gauss-Jordan, LU, substitution and cofactor routes</span>
        </div>

        <div class="topbar-actions">
          <div class="segmented" role="group" aria-label="Number display format">
            <button class="seg-btn active" id="fmt-frac" data-fmt="frac">Exact p/q</button>
            <button class="seg-btn" id="fmt-dec" data-fmt="dec">Decimal</button>
          </div>
          <button class="btn btn-icon theme-toggle-btn" id="theme-toggle" title="Toggle light or dark theme" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
        </div>
      </header>

      <main class="content-wrap" id="workspace"></main>
    </div>
  </div>

  <div class="exam-overlay" id="exam-overlay" hidden role="dialog" aria-modal="true" aria-label="Exam mode"></div>

  <script defer src="engine.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
